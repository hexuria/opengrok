<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The page is loaded with loadFile(), so its document origin is file:. CSP
  'self' alone does not match file: sources in Chromium, hence the explicit
  file: scheme beside it. Everything else stays denied: no network, no eval,
  and media only from the app's own sand-media handler or inlined data.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src sand-media: data: file:; media-src sand-media: data:; font-src 'self' file:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collections</title>
<link rel="stylesheet" href="./collections.css">
</head>
<body>
<div class="sand-col-app">
  <aside class="sand-col-side">
    <div class="sand-col-side-head">
      <span class="sand-col-side-title">Collections</span>
      <button type="button" id="sand-col-import" class="sand-col-ghost" title="Import a collection file">Import</button>
    </div>
    <nav id="sand-col-list" class="sand-col-list" aria-label="Collections"></nav>
  </aside>
  <main class="sand-col-main">
    <header class="sand-col-topbar">
      <h1 id="sand-col-title" class="sand-col-title" tabindex="0">Collections</h1>
      <div class="sand-col-topbar-actions">
        <button type="button" id="sand-col-copy" class="sand-col-ghost">Copy link</button>
        <button type="button" id="sand-col-html" class="sand-col-ghost">Export HTML</button>
        <button type="button" id="sand-col-json" class="sand-col-ghost">Export JSON</button>
        <button type="button" id="sand-col-delete" class="sand-col-ghost sand-col-danger">Delete</button>
      </div>
    </header>
    <div id="sand-col-status" class="sand-col-status" role="status" hidden></div>
    <section id="sand-col-thread" class="sand-col-thread"></section>
  </main>
</div>
<script src="./collection-render.js"></script>
<script src="./collections.js"></script>
</body>
</html>
