# cargo deny: the one gate for known-vulnerable, unsound, yanked and unmaintained dependencies,
# licenses, and where crates may come from. It reads the same RustSec database as cargo audit, so
# cargo audit is not run as well.

[graph]
all-features = true
# The app only builds for macOS. A crate that is only pulled in on Linux or Windows (glib, for one)
# is never compiled into it, so its advisories are not ours.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Every entry says why it cannot be fixed from here. Remove it when the reason goes away.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; only gpui-base and gpui-component (through gpui-kit 0.6) pull it in, so it goes when gpui drops it." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; only gpui-component and metal (through gpui-kit 0.6) pull it in, so it goes when upstream drops it." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; only usvg, through gpui, pulls it in, so it goes when gpui moves off it." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; only usvg, through gpui, pulls it in, so it goes when gpui moves off it." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "0BSD",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # libbz2-rs-sys, through gpui-kit: the permissive bzip2 licence.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# nativechat itself is publish = false (its own licence is MIT, see LICENSE); skip it here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/hexuria/gpui-agent"]
