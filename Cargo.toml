[workspace]
members = ["."]
resolver = "2"

# GPUI layout/paint in opt-level 0 is several times slower than release.
# `cargo run` stays usable: app crate at 1, gpui/taffy/etc. at 3.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
rust-embed = "8.5.0"
anyhow = "1.0"

[package]
name = "nativechat"
version = "0.1.0"
edition = "2024"
# `cargo bundle` will not build the .app without it.
description = "Chat with bots that work on their own computers."
# An app, not a library: nothing here is meant for crates.io.
publish = false

[features]
default = []
# In-process gpui-agent mailbox for screenshots / semantic UI control.
# Product builds leave this off. Launch with `--features agent` and GPUI_AGENT=1.
agent = ["dep:gpui-agent"]

[dependencies]
gpui-kit = "0.6"
markdown = "1.0"
# Grapheme boundaries for the composer's caret and deletes (#40): one press of Backspace is one
# thing a person sees, an emoji with its modifiers or a letter with its accent.
unicode-segmentation = "1.12"
gpui-fps = "0.6"
# Pinned to a commit: a git dependency with no rev follows whatever its branch says today, so
# two builds of the same tree could get two different agents.
gpui-agent = { git = "https://github.com/hexuria/gpui-agent", rev = "b828bb7a1d6bf29e813f5205a3bd1548d5f20efa", optional = true }
raw-window-handle = "0.6"
# Screenshots arrive base64 in AG-UI frames and are decoded once into a gpui Image.
base64 = "0.23"
anyhow.workspace = true
rust-embed.workspace = true
rand = "0.10"
coreaudio-sys = "0.2.17"
tokio = { version = "1.36", features = ["full"] }
# `killpg`: a command run for the server is stopped with everything it started, not only the
# shell in front of it (opengrok/local_exec.rs).
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Issue reports (src/report): what is sent is found by pattern and fingerprinted, never the raw text.
regex = "1.12"
sha2 = "0.10.9"
schemars = "1"
futures = "0.3"
url = "2.5"
log = "0.4.29"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream", "cookies"] }
# The maintained fork of dotenv (RUSTSEC-2021-0141: dotenv is unmaintained); same API.
dotenvy = "0.15"
thiserror = "2.0"
directories = "6"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde", "js"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid"] }
chrono = "0.4.42"
# This computer's IANA time zone, which the account keeps for its routines' default
# (opengrok-server PR #322). Already in the tree under chrono; asked of the system each time, so a
# zone changed while the app runs is the one it reads.
iana-time-zone = "0.1"
# The cron parser opengrok-server runs a routine's line with, at the version it pins, so the wake
# editor's next-run time and its refusals are the server's and cannot drift from them.
cron = "=0.17.0"
objc = "0.2"
cocoa = "0.27"
block = "0.1"
# Authenticator codes for the code card and the Logins detail pane.
totp-rs = { version = "6", features = ["otpauth"] }
# 1Password's 1PUX export is a ZIP with the JSON inside.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
wiremock = "0.6"
tokio = { version = "1.36", features = ["full", "test-util"] }
# A real folder on disk, for the one part of this app that reads the person's own files: a
# skill upload. What it refuses is about what a folder weighs and how many files are in it,
# and neither can be tested against a list of made-up paths.
tempfile = "3"

[lints.rust]
# An unsafe fn does not make its body one big unsafe block: each unsafe operation inside it still
# says so, and says why it holds.
unsafe_op_in_unsafe_fn = "deny"
# objc's msg_send!/class! expand to `cfg(feature = "cargo-clippy")` inside this crate. Naming the
# value here keeps that one expansion from drowning every clippy run in warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
# Every unsafe block says, in a `// SAFETY:` comment, what makes it sound.
undocumented_unsafe_blocks = "deny"
# The app's diagnostics go to stderr. stdout is not a log, and a print there once echoed every
# message a person sent.
print_stdout = "deny"

[package.metadata.bundle]
name = "NativeChat"
identifier = "dev.goldcoders.nativechat"
short_description = "A native chat application."
# The app's own mark, the cyan blob it wears in its sidebar. Without this the .app has no
# icon at all and the Dock, Finder and every launcher show the blank sheet of paper.
icon = ["assets/appicon/AppIcon.icns"]
resources = ["themes/", "assets/"]
macOS_entitlements_path = "./nativechat.entitlements"
NSMicrophoneUsageDescription = "NativeChat needs access to your microphone for voice input."

[target.'cfg(target_os = "macos")'.dependencies]
# The coworker-screen window is a WebView; only macOS builds it (see components/computer_screen.rs).
wry = "0.54"
# Site-login passwords: Keychain service `ai.nativechat.site-login`. Never sqlite.
security-framework = "3.7"
