# Weekly, grouped, so the lockfile moves in reviewable PRs instead of a drip.
#
# Two npm groups: minors and patches together (one PR, usually mergeable as-is), and majors
# one PR each, since every major here has meant API changes (zod 4, ai 7, undici 8, ...).
#
# Ignored on purpose, not forgotten:
# - electron: the packaged app runs the pinned, recovered Electron 42 runtime (scripts/lib/runtime.mjs);
#   the npm package must match it, and it moves only with the runtime.
# - @bufbuild/protobuf and @connectrpc/*: the recovered generated protos are 1.x codegen; 2.x changes
#   the generated API and would have to be regenerated from the shipped descriptors first.
# - tree-sitter, tree-sitter-bash, web-tree-sitter: 0.x native/wasm ABI, where a minor is a break and
#   the grammar and the runtime must move together.
#
# Note: CI's "Fetch the recovered material" step needs STOW_DEPLOY_KEY, and GitHub gives
# Dependabot-triggered runs only *Dependabot* secrets, so the key has to exist there too
# (gh secret set STOW_DEPLOY_KEY --app dependabot).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # zod is a peer dependency of the AI SDKs, so they only move together: the Claude Agent
      # SDK's 0.3 line requires zod ^4 while @ai-sdk/* 1.x requires ^3, and a lone bump of any
      # one of them fails `npm ci` with ERESOLVE (seen on #29). One PR, one decision.
      zod-and-ai-sdks:
        patterns: ["zod", "zod-to-json-schema", "ai", "@ai-sdk/*", "@anthropic-ai/claude-agent-sdk"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Every ignore names its update-types on purpose: a bare `dependency-name` would mute
    # Dependabot's SECURITY updates for that package too, so a Chromium CVE in the pinned
    # Electron line would arrive as silence. Naming the three version-update types blocks
    # routine bumps and still lets a security advisory open a PR.
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@bufbuild/protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@connectrpc/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: tree-sitter
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: tree-sitter-bash
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: web-tree-sitter
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    open-pull-requests-limit: 6
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
