name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What CI can and cannot do here.
#
# `frontend/` (the editable reconstruction) is deliberately gitignored — see
# CLAUDE.md — so a clean clone does not have it. That rules three things out
# of CI, and they stay local pre-flight steps:
#   * `npm run typecheck` / `npm run frontend:build` — need frontend/tsconfig.json
#   * `npm run publication:check` — diffs the working tree against a clean-history
#     export, which requires the private material to be present
#   * `npm run package` — clean-build stages frontend/src and its manifests
# What is left is the part that genuinely benefits from a matrix: the source
# typecheck and the test suite, on all three desktop platforms, so darwin-only
# assumptions surface here instead of on a user's machine.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Typecheck the source tree
        run: npm run source:typecheck
      - name: Run the test suite
        run: npm test
