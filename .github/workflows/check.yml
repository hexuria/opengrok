name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository does not track the material recovered from the shipped
# binary (CLAUDE.md): source/packages/{proto,redacted-protos}/generated and
# frontend/ are gitignored, yet hundreds of source files and 17 test files
# read them, so a bare checkout can neither typecheck nor test. CI restores
# them from the private hexuria/opengrok-stow archive with a read-only deploy
# key, into the workspace only - never committed here, never uploaded as an
# artifact.
#
# The fetch is required, not best-effort: if it fails the run stops with a
# clear message rather than a wall of TS2307. Note that GitHub withholds
# secrets from forked pull requests, so a fork PR fails at that step by
# design.
#
# `publication:check` stays out: it diffs the working tree against a
# clean-history export, which the staged material would confound. It remains
# a local pre-flight.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the recovered material
        uses: actions/checkout@v7
        with:
          repository: hexuria/opengrok-stow
          # No lfs: the archive's release DMGs are hundreds of MB and no
          # check needs their contents; the inventory test treats an
          # unmaterialised pointer as absent.
          ssh-key: ${{ secrets.STOW_DEPLOY_KEY }}
          path: .stow-material

      - name: Restore it into the working tree
        shell: bash
        run: |
          scripts/ci-restore-recovered.sh .stow-material
          rm -rf .stow-material

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm

      # This is also the lockfile guard: `npm ci` refuses a lock that has drifted from the
      # manifest, which is how the nine dropped transitive entries surfaced on 2 Sep 2026 —
      # they were only invisible while the CI outage stopped any run reaching this step.
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend and source, run the test suite
        run: npm run check
      # Checks and tests never package, so a dependency that breaks the build passes here and
      # fails on whoever packages next. Packaging wraps npm Electron 42 and rebuilt natives;
      # skip when the stow-restored app or Electron headers are missing.
      - name: Package the app
        if: runner.os == 'macOS'
        run: |
          if [ -d "src/app/dist" ] && [ -n "${ELECTRON_HEADERS_DIR:-}" ]; then
            npm run package
          else
            echo "no upstream app or Electron headers on this runner; packaging skipped"
          fi
