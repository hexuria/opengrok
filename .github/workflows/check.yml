name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository does not track the material recovered from the shipped
# binary (CLAUDE.md): source/packages/{proto,redacted-protos}/generated and
# frontend/ are gitignored, yet hundreds of source files and 17 test files
# read them, so a bare checkout can neither typecheck nor test. CI restores
# them from the private hexuria/opengrok-stow archive with a read-only deploy
# key, into the workspace only - never committed here, never uploaded as an
# artifact.
#
# The fetch is required, not best-effort: if it fails the run stops with a
# clear message rather than a wall of TS2307. Note that GitHub withholds
# secrets from forked pull requests, so a fork PR fails at that step by
# design.
#
# `publication:check` stays out: it diffs the working tree against a
# clean-history export, which the staged material would confound. It remains
# a local pre-flight.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recovered material
        uses: actions/checkout@v4
        with:
          repository: hexuria/opengrok-stow
          ssh-key: ${{ secrets.STOW_DEPLOY_KEY }}
          path: .stow-material

      - name: Restore it into the working tree
        shell: bash
        run: |
          set -euo pipefail
          for pkg in proto redacted-protos; do
            src=".stow-material/source/packages/$pkg/generated"
            test -d "$src" || { echo "archive is missing $src"; exit 1; }
            mkdir -p "source/packages/$pkg"
            cp -R "$src" "source/packages/$pkg/generated"
          done
          test -d ".stow-material/frontend" || { echo "archive is missing frontend/"; exit 1; }
          cp -R .stow-material/frontend frontend
          rm -rf .stow-material
          echo "restored $(find source/packages -name '*.ts' -path '*generated*' | wc -l | tr -d ' ') proto files and frontend/"

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund

      # Recovers the checksum-pinned renderer that the icon and anchor checks
      # read. It needs macOS-only hdiutil; elsewhere those few tests skip.
      - name: Recover the pinned runtime
        if: runner.os == 'macOS'
        run: npm run bootstrap

      - name: Typecheck frontend and source, run the test suite
        run: npm run check
