name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository does not track the material recovered from the shipped
# binary (CLAUDE.md): `source/packages/proto/generated/` and `frontend/` are
# gitignored, and 361 source files import proto/generated, so a bare checkout
# cannot typecheck. CI therefore fetches the protos from the private
# hexuria/opengrok-stow archive with a read-only deploy key, into the
# workspace only — they are never committed here and never uploaded as an
# artifact.
#
# Secrets are withheld from forked pull requests by design, so that case
# degrades to the checks that need no protos rather than failing loudly.
#
# The pinned renderer is recovered by `npm run bootstrap`, which needs
# macOS-only hdiutil; the handful of tests that read it skip where it is
# absent, so ubuntu and windows still run the rest of the suite.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recovered protobuf definitions
        id: protos
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: hexuria/opengrok-stow
          ssh-key: ${{ secrets.STOW_DEPLOY_KEY }}
          path: .stow-protos

      - name: Stage the recovered packages into the source tree
        if: steps.protos.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Both gitignored package trees, copied by name so a third one
          # added later fails loudly here instead of as a wall of TS2307.
          for pkg in proto redacted-protos; do
            src=".stow-protos/source/packages/$pkg/generated"
            test -d "$src" || { echo "archive is missing $src"; exit 1; }
            mkdir -p "source/packages/$pkg"
            cp -R "$src" "source/packages/$pkg/generated"
            echo "staged $pkg: $(find "source/packages/$pkg/generated" -name "*.ts" | wc -l | tr -d " ") files"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund

      # Recovers the checksum-pinned renderer the icon/anchor checks read.
      # hdiutil is macOS-only; elsewhere those few tests skip.
      - name: Recover the pinned runtime
        if: runner.os == 'macOS'
        run: npm run bootstrap

      - name: Typecheck the source tree
        if: steps.protos.outcome == 'success'
        run: npm run source:typecheck

      - name: Run the test suite
        run: npm test
