name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository does not track the material recovered from the shipped
# binary (CLAUDE.md): source/packages/{proto,redacted-protos}/generated and
# frontend/ are gitignored, yet hundreds of source files and 17 test files
# read them, so a bare checkout can neither typecheck nor test. CI restores
# them from the private hexuria/opengrok-stow archive with a read-only deploy
# key, into the workspace only - never committed here, never uploaded as an
# artifact.
#
# The fetch is required, not best-effort: if it fails the run stops with a
# clear message rather than a wall of TS2307.
#
# GitHub withholds Actions secrets from `pull_request` on a fork
# (https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions#using-secrets-in-a-workflow).
# `STOW_DEPLOY_KEY` is already wired into the stow checkout below; push and
# same-repo PRs see it. Fork PRs cannot clone hexuria/opengrok-stow. Do not
# switch this workflow to `pull_request_target`: restoring the archive and
# then running the PR's tests would let a fork exfiltrate the recovered tree.
# Those jobs are skipped; open the PR from a hexuria branch, or use the push
# CI on that branch.
#
# `publication:check` stays out: it diffs the working tree against a
# clean-history export, which the staged material would confound. It remains
# a local pre-flight.
jobs:
  fork-stow-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fork PRs cannot restore the private stow
        run: |
          echo "::notice::Fork pull_request events do not receive STOW_DEPLOY_KEY, so this workflow cannot clone hexuria/opengrok-stow. Open the PR from a hexuria branch, or rely on that branch's push CI. pull_request_target is not used: it would restore the recovered tree and then run the PR's tests."

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the recovered material
        uses: actions/checkout@v7
        with:
          repository: hexuria/opengrok-stow
          # No lfs: the archive's release DMGs are hundreds of MB and no
          # check needs their contents; the inventory test treats an
          # unmaterialised pointer as absent.
          ssh-key: ${{ secrets.STOW_DEPLOY_KEY }}
          persist-credentials: false
          path: .stow-material

      - name: Restore it into the working tree
        shell: bash
        run: |
          scripts/ci-restore-recovered.sh .stow-material
          rm -rf .stow-material

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: npm

      # This is also the lockfile guard: `npm ci` refuses a lock that has drifted from the
      # manifest, which is how the nine dropped transitive entries surfaced on 2 Sep 2026 —
      # they were only invisible while the CI outage stopped any run reaching this step.
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund

      # Recovers the checksum-pinned renderer that the icon and anchor checks
      # read. Best-effort: it needs macOS-only hdiutil, and the vendor CDN
      # answers 403 to hosted runners, so the handful of tests that read the
      # renderer skip instead. Never let it fail the run.
      - name: Recover the pinned runtime (best-effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm run bootstrap

      - name: Typecheck frontend and source, run the test suite
        run: npm run check
      # Checks and tests never package, so a dependency that breaks the build passes here and
      # fails on whoever packages next (2 Sep 2026: undici 8 against the pinned runtime version
      # the Electron main bundle keeps external). Package on macOS, where the runtime is
      # recoverable; the bootstrap step above is best-effort, so skip when it did not land.
      - name: Package the app
        if: runner.os == 'macOS'
        run: |
          if [ -d ".cache/runtime/Grok Bot.app" ] && [ -d "src/app/dist" ]; then
            npm run package
          else
            echo "no pinned runtime or upstream app on this runner; packaging skipped"
          fi
